<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Rocket Math - Eksponen Kelas X</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #0a0a2e;
        }

        /* STAR BACKGROUND */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            z-index: -2;
        }

        .stars::before, .stars::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent),
                radial-gradient(1px 1px at 200px 60px, #fff, transparent),
                radial-gradient(2px 2px at 250px 20px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 300px 90px, #fff, transparent);
            background-size: 350px 100px;
            animation: twinkle 5s ease-in-out infinite alternate;
        }

        .stars::after {
            background-image: 
                radial-gradient(1px 1px at 50px 50px, #fff, transparent),
                radial-gradient(2px 2px at 100px 30px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 150px 70px, #fff, transparent),
                radial-gradient(2px 2px at 220px 40px, rgba(255,255,255,0.8), transparent);
            background-size: 280px 120px;
            animation: twinkle 3s ease-in-out infinite alternate-reverse;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* GAME CONTAINER */
        .game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER */
        .game-header {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(102, 51, 153, 0.8), rgba(0, 102, 204, 0.8));
            border-bottom: 3px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            z-index: 10;
        }

        .score-board {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .score-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #00ff88;
            color: #00ff88;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff88;
        }

        .game-title {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 20px #ff6600;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff6600, 0 0 20px #ff6600; }
            to { text-shadow: 0 0 20px #ffaa00, 0 0 40px #ffaa00, 0 0 60px #ffaa00; }
        }

        /* QUESTION AREA */
        .question-area {
            margin-top: 20px;
            text-align: center;
            z-index: 10;
        }

        .question-number {
            color: #ffcc00;
            font-size: 16px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px #ffcc00;
        }

        .question-box {
            background: linear-gradient(135deg, rgba(255, 102, 0, 0.2), rgba(255, 0, 102, 0.2));
            border: 2px solid #ff6600;
            border-radius: 15px;
            padding: 20px 40px;
            display: inline-block;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.3);
        }

        .question-text {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* ROCKET */
        .rocket-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            transition: left 0.3s ease;
        }

        .rocket {
            font-size: 60px;
            animation: rocketHover 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px #ff6600);
        }

        @keyframes rocketHover {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .rocket-flame {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 30px;
            background: linear-gradient(to top, transparent, #ff6600, #ffcc00);
            border-radius: 50% 50% 20% 20%;
            animation: flame 0.3s ease-in-out infinite alternate;
        }

        @keyframes flame {
            0% { height: 25px; opacity: 0.8; }
            100% { height: 35px; opacity: 1; }
        }

        /* ANSWER TARGETS */
        .answers-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            z-index: 5;
            margin-top: 40px;
        }

        .answer-target {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: 3px solid #00ffff;
            border-radius: 15px;
            padding: 20px 30px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            text-align: center;
            min-width: 150px;
            position: relative;
            overflow: hidden;
        }

        .answer-target::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .answer-target:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            border-color: #ffcc00;
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .answer-target.correct {
            animation: correctAnswer 0.5s ease;
            background: linear-gradient(135deg, #00b09b, #96c93d) !important;
            border-color: #00ff88 !important;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.8) !important;
        }

        .answer-target.wrong {
            animation: wrongAnswer 0.5s ease;
            background: linear-gradient(135deg, #ff416c, #ff4b2b) !important;
            border-color: #ff0000 !important;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.8) !important;
        }

        @keyframes correctAnswer {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes wrongAnswer {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        /* EXPLOSION EFFECT */
        .explosion {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            animation: explode 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes explode {
            0% { 
                transform: scale(0); 
                opacity: 1;
                background: radial-gradient(circle, #ffcc00, #ff6600, transparent);
            }
            50% { 
                transform: scale(2); 
                opacity: 0.7;
                background: radial-gradient(circle, #ff6600, #ff0000, transparent);
            }
            100% { 
                transform: scale(3); 
                opacity: 0;
                background: radial-gradient(circle, transparent, transparent, transparent);
            }
        }

        /* FEEDBACK */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            z-index: 100;
            animation: feedbackAnim 1.5s ease forwards;
            pointer-events: none;
            text-shadow: 0 0 20px currentColor;
        }

        .feedback.correct {
            color: #00ff88;
        }

        .feedback.wrong {
            color: #ff4444;
        }

        @keyframes feedbackAnim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* START SCREEN */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a4e 0%, #0a0a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .start-screen h1 {
            font-size: 48px;
            color: #fff;
            text-shadow: 0 0 30px #ff6600, 0 0 60px #ff6600;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .start-screen h2 {
            font-size: 22px;
            color: #00ffff;
            margin-bottom: 5px;
            text-shadow: 0 0 15px #00ffff;
        }

        .start-screen h3 {
            font-size: 18px;
            color: #ffcc00;
            margin-bottom: 30px;
        }

        .start-rocket {
            font-size: 100px;
            animation: rocketFloat 3s ease-in-out infinite;
            margin-bottom: 30px;
        }

        @keyframes rocketFloat {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .start-btn {
            background: linear-gradient(135deg, #ff6600, #ff0066);
            border: none;
            padding: 18px 50px;
            font-size: 24px;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(255, 102, 0, 0.8);
        }

        .instructions {
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
            line-height: 1.8;
        }

        /* END SCREEN */
        .end-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a4e 0%, #0a0a2e 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .end-screen h1 {
            font-size: 42px;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ffcc00;
        }

        .final-score {
            font-size: 72px;
            color: #00ff88;
            font-weight: bold;
            text-shadow: 0 0 30px #00ff88;
            margin-bottom: 10px;
        }

        .final-message {
            font-size: 22px;
            color: #ffcc00;
            margin-bottom: 30px;
        }

        .stars-earned {
            font-size: 50px;
            margin-bottom: 30px;
        }

        /* PROGRESS BAR */
        .progress-container {
            width: 80%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00ffff);
            border-radius: 4px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px #00ff88;
        }

        /* PARTICLES */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: particleFly 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* SHOOTING EFFECT */
        .laser {
            position: absolute;
            width: 4px;
            height: 40px;
            background: linear-gradient(to top, #ff0000, #ff6600, #ffcc00);
            border-radius: 2px;
            animation: laserShoot 0.3s ease-out forwards;
            pointer-events: none;
            z-index: 15;
            box-shadow: 0 0 10px #ff6600, 0 0 20px #ffcc00;
        }

        @keyframes laserShoot {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-300px); opacity: 0; }
        }

        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .question-text { font-size: 18px; }
            .answer-target { padding: 15px 20px; font-size: 16px; min-width: 120px; }
            .game-title { font-size: 14px; }
            .start-screen h1 { font-size: 32px; }
            .answers-container { gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <!-- START SCREEN -->
    <div class="start-screen" id="startScreen">
        <div class="start-rocket">🚀</div>
        <h1>ROCKET MATH</h1>
        <h2>Perkalian & Pembagian Bilangan Eksponen</h2>
        <h3>📚 Matematika Kelas X</h3>
        <button class="start-btn" onclick="startGame()">🎮 MULAI MISI</button>
        <div class="instructions">
            <p>🎯 Tembak jawaban yang BENAR!</p>
            <p>📝 10 Soal Pilihan Ganda</p>
            <p>⭐ Kumpulkan skor tertinggi!</p>
        </div>
    </div>

    <!-- END SCREEN -->
    <div class="end-screen" id="endScreen">
        <div class="start-rocket">🚀</div>
        <h1>🏆 MISI SELESAI!</h1>
        <div class="final-score" id="finalScore">0/10</div>
        <div class="final-message" id="finalMessage"></div>
        <div class="stars-earned" id="starsEarned"></div>
        <button class="start-btn" onclick="restartGame()">🔄 MAIN LAGI</button>
    </div>

    <!-- GAME CONTAINER -->
    <div class="game-container hidden" id="gameContainer">
        <!-- HEADER -->
        <div class="game-header">
            <div class="score-board">
                <div class="score-item">⭐ Skor: <span id="score">0</span></div>
                <div class="score-item">❌ Salah: <span id="wrong">0</span></div>
            </div>
            <div class="game-title">🚀 ROCKET MATH</div>
            <div class="score-board">
                <div class="score-item">📝 Soal: <span id="questionNum">1</span>/10</div>
            </div>
        </div>

        <!-- PROGRESS BAR -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>

        <!-- QUESTION -->
        <div class="question-area">
            <div class="question-number" id="questionLabel">Soal 1 dari 10</div>
            <div class="question-box">
                <div class="question-text" id="questionText"></div>
            </div>
        </div>

        <!-- ANSWERS -->
        <div class="answers-container" id="answersContainer"></div>

        <!-- ROCKET -->
        <div class="rocket-container" id="rocketContainer">
            <div class="rocket">🚀</div>
            <div class="rocket-flame"></div>
        </div>
    </div>

    <script>
        // SOAL-SOAL
        const questions = [
            {
                question: "2³ × 2⁴ = ?",
                answers: ["2⁷ = 128", "2¹² = 4096", "4⁷", "2¹ = 2"],
                correct: 0
            },
            {
                question: "3⁵ × 3² = ?",
                answers: ["3¹⁰", "3⁷ = 2187", "9⁷", "3³ = 27"],
                correct: 1
            },
            {
                question: "5⁶ ÷ 5² = ?",
                answers: ["5⁸", "5³ = 125", "5⁴ = 625", "1⁴"],
                correct: 2
            },
            {
                question: "4³ × 4² = ?",
                answers: ["4⁵ = 1024", "4⁶ = 4096", "8⁵", "16⁵"],
                correct: 0
            },
            {
                question: "7⁸ ÷ 7³ = ?",
                answers: ["7¹¹", "7⁵ = 16807", "7²⁴", "1⁵"],
                correct: 1
            },
            {
                question: "2³ × 3³ = ?",
                answers: ["5⁶", "6³ = 216", "6⁶", "5³ = 125"],
                correct: 1
            },
            {
                question: "10⁴ ÷ 10² = ?",
                answers: ["10⁶", "10⁸", "10² = 100", "1²"],
                correct: 2
            },
            {
                question: "2⁵ × 2³ ÷ 2⁴ = ?",
                answers: ["2⁴ = 16", "2² = 4", "2⁸ = 256", "2⁶ = 64"],
                correct: 0
            },
            {
                question: "6⁴ ÷ 6² = ?",
                answers: ["6⁶", "6² = 36", "6⁸", "1²"],
                correct: 1
            },
            {
                question: "3² × 3⁴ ÷ 3³ = ?",
                answers: ["3⁹", "3¹ = 3", "3³ = 27", "3⁵ = 243"],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswering = false;

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            currentQuestion = 0;
            score = 0;
            wrongCount = 0;
            updateScore();
            loadQuestion();
        }

        function restartGame() {
            document.getElementById('endScreen').style.display = 'none';
            document.getElementById('gameContainer').classList.remove('hidden');
            currentQuestion = 0;
            score = 0;
            wrongCount = 0;
            updateScore();
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                endGame();
                return;
            }

            isAnswering = false;
            const q = questions[currentQuestion];
            
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('questionLabel').textContent = `Soal ${currentQuestion + 1} dari 10`;
            document.getElementById('questionNum').textContent = currentQuestion + 1;
            document.getElementById('progressBar').style.width = `${(currentQuestion / 10) * 100}%`;

            const container = document.getElementById('answersContainer');
            container.innerHTML = '';

            q.answers.forEach((answer, index) => {
                const target = document.createElement('div');
                target.className = 'answer-target';
                target.textContent = answer;
                target.onclick = () => selectAnswer(index, target);
                target.style.animationDelay = `${index * 0.1}s`;
                container.appendChild(target);
            });
        }

        function selectAnswer(index, element) {
            if (isAnswering) return;
            isAnswering = true;

            const q = questions[currentQuestion];
            
            // Create laser effect
            createLaser(element);

            setTimeout(() => {
                if (index === q.correct) {
                    // CORRECT
                    element.classList.add('correct');
                    score++;
                    createExplosion(element);
                    createParticles(element, '#00ff88');
                    showFeedback('✅ BENAR!', 'correct');
                    playSound('correct');
                } else {
                    // WRONG
                    element.classList.add('wrong');
                    wrongCount++;
                    showFeedback('❌ SALAH!', 'wrong');
                    playSound('wrong');
                    
                    // Show correct answer
                    const targets = document.querySelectorAll('.answer-target');
                    targets[q.correct].classList.add('correct');
                }

                updateScore();

                setTimeout(() => {
                    currentQuestion++;
                    loadQuestion();
                }, 1500);
            }, 300);
        }

        function createLaser(element) {
            const rocket = document.getElementById('rocketContainer');
            const laser = document.createElement('div');
            laser.className = 'laser';
            
            const rocketRect = rocket.getBoundingClientRect();
            const elemRect = element.getBoundingClientRect();
            
            laser.style.left = `${rocketRect.left + rocketRect.width / 2 - 2}px`;
            laser.style.top = `${rocketRect.top}px`;
            
            document.body.appendChild(laser);
            
            setTimeout(() => laser.remove(), 300);
        }

        function createExplosion(element) {
            const rect = element.getBoundingClientRect();
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = `${rect.left + rect.width / 2 - 50}px`;
            explosion.style.top = `${rect.top + rect.height / 2 - 50}px`;
            document.body.appendChild(explosion);
            setTimeout(() => explosion.remove(), 600);
        }

        function createParticles(element, color) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                particle.style.background = color;
                particle.style.setProperty('--tx', `${(Math.random() - 0.5) * 200}px`);
                particle.style.setProperty('--ty', `${(Math.random() - 0.5) * 200}px`);
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        function showFeedback(text, type) {
            const feedback = document.createElement('div');
            feedback.className = `feedback ${type}`;
            feedback.textContent = text;
            document.body.appendChild(feedback);
            setTimeout(() => feedback.remove(), 1500);
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('wrong').textContent = wrongCount;
        }

        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'correct') {
                    oscillator.frequency.setValueAtTime(523, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
                } else {
                    oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime + 0.1);
                }
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function endGame() {
            document.getElementById('gameContainer').classList.add('hidden');
            const endScreen = document.getElementById('endScreen');
            endScreen.style.display = 'flex';

            document.getElementById('finalScore').textContent = `${score}/10`;
            document.getElementById('progressBar').style.width = '100%';

            let message = '';
            let stars = '';

            if (score === 10) {
                message = '🎉 SEMPURNA! Kamu luar biasa!';
                stars = '⭐⭐⭐⭐⭐';
            } else if (score >= 8) {
                message = '👏 HEBAT! Hampir sempurna!';
                stars = '⭐⭐⭐⭐';
            } else if (score >= 6) {
                message = '👍 BAGUS! Terus berlatih!';
                stars = '⭐⭐⭐';
            } else if (score >= 4) {
                message = '💪 LUMAYAN! Ayo tingkatkan!';
                stars = '⭐⭐';
            } else {
                message = '📚 Ayo belajar lagi! Kamu pasti bisa!';
                stars = '⭐';
            }

            document.getElementById('finalMessage').textContent = message;
            document.getElementById('starsEarned').textContent = stars;
        }

        // Move rocket with mouse/touch
        document.addEventListener('mousemove', (e) => {
            const rocket = document.getElementById('rocketContainer');
            if (rocket && !document.getElementById('gameContainer').classList.contains('hidden')) {
                const x = Math.max(50, Math.min(e.clientX, window.innerWidth - 50));
                rocket.style.left = `${x}px`;
                rocket.style.transform = 'translateX(-50%)';
            }
        });

        document.addEventListener('touchmove', (e) => {
            const rocket = document.getElementById('rocketContainer');
            if (rocket && !document.getElementById('gameContainer').classList.contains('hidden')) {
                const x = Math.max(50, Math.min(e.touches[0].clientX, window.innerWidth - 50));
                rocket.style.left = `${x}px`;
                rocket.style.transform = 'translateX(-50%)';
            }
        });
    </script>
</body>
</html>
